{
  "global": {
    "scrape_interval": "5s",
    "evaluation_interval": "5s"
  },
  "rule_files": [
    "/etc/prometheus/alerts.yml"
  ],
  "scrape_configs": [
    {
      "job_name": "aj-applications",
      "static_configs": [
        {
          "targets": [
            "users:7000",
            "products:7000",
            "orders:7000",
            "payments:7000",
            "product-view:7000",
            "product-synchronizer:7000",
            "apigateway:7000",
            "frontend:7000"
          ]
        }
      ]
    },
    {
      "job_name": "rabbitmq",
      "static_configs": [
        {
          "targets": [
            "rabbitmq:15692"
          ]
        }
      ]
    }
  ]
}
