{
  "name": "aj-users",
  "services": {
    "users-db": {
      "image": "postgres:16-alpine",
      "restart": "unless-stopped",
      "environment": {
        "POSTGRES_DB": "users",
        "POSTGRES_USER": "postgres",
        "POSTGRES_PASSWORD": "postgres"
      },
      "ports": [
        "127.0.0.1:5433:5432"
      ],
      "volumes": [
        "users-postgres-data:/var/lib/postgresql/data"
      ],
      "networks": [
        "users-data"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U postgres -d users"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 20
      }
    },
    "users": {
      "build": {
        "context": "..",
        "dockerfile": "Dockerfile",
        "args": {
          "SERVICE": "users"
        }
      },
      "image": "aj-users:local",
      "restart": "unless-stopped",
      "environment": {
        "PORT": "7000",
        "DB_URL": "jdbc:postgresql://users-db:5432/users",
        "DB_USER": "postgres",
        "DB_PASSWORD": "postgres",
        "RABBITMQ_URL": "amqp://aj:aj-local@rabbitmq:5672/%2f",
        "DEMO_DATA_ENABLED": "${DEMO_DATA_ENABLED:-true}",
        "OIDC_ISSUER": "http://localhost:8180/realms/aj",
        "OIDC_JWKS_URL": "http://keycloak:8180/realms/aj/protocol/openid-connect/certs",
        "DB_BASELINE_EXISTING": "true"
      },
      "ports": [
        "127.0.0.1:7002:7000"
      ],
      "networks": [
        "backend",
        "users-data"
      ],
      "depends_on": {
        "users-db": {
          "condition": "service_healthy"
        }
      }
    }
  },
  "volumes": {
    "users-postgres-data": {}
  },
  "networks": {
    "users-data": {},
    "backend": {
      "external": true,
      "name": "aj-backend"
    }
  }
}
