<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="448" viewBox="0 0 1200 448" role="img" aria-labelledby="title desc">
<title id="title">Reliable message delivery</title><desc id="desc">One eventId across retries | one correlationId across the business flow</desc>
<defs><marker id="arrow-172b4d" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#172b4d"/></marker><marker id="arrow-2563a6" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2563a6"/></marker><marker id="arrow-187a69" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#187a69"/></marker><marker id="arrow-7556a6" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7556a6"/></marker><marker id="arrow-9c6720" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9c6720"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif} .body{font-size:22px;fill:#172b4d}.small{font-size:19px;fill:#475569}.heading{font-size:19px;font-weight:700;letter-spacing:.5px}</style>
<rect width="1200" height="448" fill="white"/>
<text x="24" y="36" font-size="30" fill="#172b4d" font-weight="700" text-anchor="start">Reliable message delivery</text>
<text x="24" y="68" font-size="20" fill="#475569" font-weight="400" text-anchor="start">One eventId across retries | one correlationId across the business flow</text>
<rect x="40" y="105" width="250" height="58" rx="12" fill="#f5f8fc" stroke="#187a69" stroke-width="1.6"/>
<text x="165" y="141" font-size="19" fill="#187a69" font-weight="700" text-anchor="middle">OWNER DATABASE</text>
<line x1="165" y1="168" x2="165" y2="369" stroke="#cbd5e1" stroke-dasharray="5 5"/>
<rect x="330" y="105" width="250" height="58" rx="12" fill="#f5f8fc" stroke="#2563a6" stroke-width="1.6"/>
<text x="455" y="141" font-size="19" fill="#2563a6" font-weight="700" text-anchor="middle">PUBLISHER</text>
<line x1="455" y1="168" x2="455" y2="369" stroke="#cbd5e1" stroke-dasharray="5 5"/>
<rect x="620" y="105" width="250" height="58" rx="12" fill="#f5f8fc" stroke="#9c6720" stroke-width="1.6"/>
<text x="745" y="141" font-size="19" fill="#9c6720" font-weight="700" text-anchor="middle">RABBITMQ</text>
<line x1="745" y1="168" x2="745" y2="369" stroke="#cbd5e1" stroke-dasharray="5 5"/>
<rect x="910" y="105" width="250" height="58" rx="12" fill="#f5f8fc" stroke="#2563a6" stroke-width="1.6"/>
<text x="1035" y="141" font-size="19" fill="#2563a6" font-weight="700" text-anchor="middle">CONSUMER</text>
<line x1="1035" y1="168" x2="1035" y2="369" stroke="#cbd5e1" stroke-dasharray="5 5"/>
<text x="184" y="194" font-size="19" fill="#187a69" font-weight="400" text-anchor="start">1  State + outbox commit</text>
<polyline points="165,213 455,213" fill="none" stroke="#187a69" stroke-width="2.5" marker-end="url(#arrow-187a69)"/>
<text x="485" y="198" font-size="19" fill="#172b4d" font-weight="400" text-anchor="start">2  Publish persistent event</text>
<polyline points="455,230 745,230" fill="none" stroke="#9c6720" stroke-width="2.5" marker-end="url(#arrow-9c6720)" stroke-dasharray="7 5"/>
<text x="490" y="265" font-size="19" fill="#9c6720" font-weight="400" text-anchor="start">3  Broker confirms receipt</text>
<polyline points="745,277 455,277" fill="none" stroke="#9c6720" stroke-width="2.5" marker-end="url(#arrow-9c6720)" stroke-dasharray="7 5"/>
<text x="182" y="313" font-size="19" fill="#187a69" font-weight="400" text-anchor="start">4  Commit outbox removal</text>
<polyline points="455,324 165,324" fill="none" stroke="#187a69" stroke-width="2.5" marker-end="url(#arrow-187a69)"/>
<text x="765" y="198" font-size="19" fill="#172b4d" font-weight="400" text-anchor="start">5  Ready → delivery</text>
<polyline points="745,230 1035,230" fill="none" stroke="#9c6720" stroke-width="2.5" marker-end="url(#arrow-9c6720)" stroke-dasharray="7 5"/>
<text x="1051" y="268" font-size="18" fill="#172b4d" font-weight="400" text-anchor="start">6  Commit</text>
<text x="1051" y="292" font-size="18" fill="#172b4d" font-weight="400" text-anchor="start">inbox + state</text>
<text x="800" y="339" font-size="19" fill="#172b4d" font-weight="400" text-anchor="start">7  Consumer ACK</text>
<polyline points="1035,352 745,352" fill="none" stroke="#9c6720" stroke-width="2.5" marker-end="url(#arrow-9c6720)" stroke-dasharray="7 5"/>
<rect x="20" y="386" width="1160" height="47" rx="12" fill="#f4f0fa" stroke="#d7cce8" stroke-width="1.6"/>
<text x="40" y="416" font-size="20" fill="#172b4d" font-weight="400" text-anchor="start">Outbox = waiting to send | Ready = queued | Unacked = processing | Loki = correlated delivery history</text>
</svg>
