="row" x="0" dy="1em" xml:space="preserve">POST /users/me</tspan><tspan class="row" x="0" dy="1em" xml:space="preserve">POST /orders</tspan><tspan class="row" x="0" dy="1em" xml:space="preserve">GET own orders / history / PDF</tspan></text></g></g><g transform="translate(666.8564453125, 48.5)" data-id="Admin" data-node="true" id="flowchart-Admin-15" class="node default default flowchart-label"><rect height="97" width="354.837890625" y="-48.5" x="-177.4189453125" ry="0" rx="0" style="" class="basic label-container"></rect><g transform="translate(0, -41)" style="" class="label"><rect></rect><text style=""><tspan class="row" x="0" dy="1em" xml:space="preserve">Administrator</tspan><tspan class="row" x="0" dy="1em" xml:space="preserve">Customer/car maintenance</tspan><tspan class="row" x="0" dy="1em" xml:space="preserve">POST /products/description-draft</tspan><tspan class="row" x="0" dy="1em" xml:space="preserve">POST /payments; PUT payment result</tspan></text></g></g><g transform="translate(318.1875, 182.5)" data-id="Boundary" data-node="true" id="flowchart-Boundary-16" class="node default default flowchart-label"><rect height="57" width="479.6875" y="-28.5" x="-239.84375" ry="0" rx="0" style="" class="basic label-container"></rect><g transform="translate(0, -21)" style="" class="label"><rect></rect><text style=""><tspan class="row" x="0" dy="1em" xml:space="preserve">Frontend / Gateway: /api/v1</tspan><tspan class="row" x="0" dy="1em" xml:space="preserve">Each domain backend enforces its own access rules</tspan></text></g></g><g transform="translate(1044.439453125, 48.5)" data-id="Internal" data-node="true" id="flowchart-Internal-17" class="node default default flowchart-label"><rect height="77" width="350.328125" y="-38.5" x="-175.1640625" ry="0" rx="0" style="" class="basic label-container"></rect><g transform="translate(0, -31)" style="" class="label"><rect></rect><text style=""><tspan class="row" x="0" dy="1em" xml:space="preserve">Internal writers</tspan><tspan