services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: soap
      POSTGRES_USER: soap
      POSTGRES_PASSWORD: "622f7e8eaec14681955849732fa629cf"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soap -d soap"]
      interval: 5s
      timeout: 5s
      retries: 10
  pgadmin:
    image: dpage/pgadmin4:9
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: "129b12756a5a4fbc99c9eaadbbd6a70f"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
  pgadmin_data:
