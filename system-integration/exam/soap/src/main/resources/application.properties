# Serveren er kun tilgængelig fra denne computer.
server.address=127.0.0.1

# Applikationens navn, som blandt andet vises i loggen.
spring.application.name=soap-products

# Databaseadresse: brug DB_URL, eller den lokale PostgreSQL-database som standard.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/soap}
# Databasebruger: brug DB_USER, eller soap som standard.
spring.datasource.username=${DB_USER:soap}
# Password til den lokale PostgreSQL-database i compose.yaml.
spring.datasource.password=622f7e8eaec14681955849732fa629cf

# Kør schema.sql og derefter data.sql ved hver opstart.
# data.sql sletter alle produkter, nulstiller id og opretter 50 eksempelprodukter.
spring.sql.init.mode=always

# Undlad Springs automatiske testbruger og genererede login-password.
# CSRF og sikkerhedsheaders konfigureres stadig i SecurityConfig.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# JavaScript i browseren må ikke læse sessionscookien.
server.servlet.session.cookie.http-only=true
# Browseren sender kun sessionscookien ved requests fra samme site.
# Ekstra CSRF-beskyttelse ud over kontrollen af tokenet.
server.servlet.session.cookie.same-site=strict

# Skjul interne fejlbeskeder og stacktraces i Spring Boots HTTP-fejlsvar.
# SOAP faults defineres separat i vores fault-klasser.
server.error.include-message=never
server.error.include-stacktrace=never

# Fælles SOAP-sti. Endpointets /products giver adressen /services/products.
cxf.path=/services

# Log Spring-beskeder fra INFO og opefter (også WARN og ERROR).
logging.level.org.springframework=INFO
# Slå Spring Boots ekstra debug- og trace-logning fra.
debug=false
trace=false
