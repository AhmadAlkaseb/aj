name: restful
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: bookcatalog
      POSTGRES_USER: bookuser
      POSTGRES_PASSWORD: bookpass
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookuser -d bookcatalog"]
      interval: 5s
      timeout: 5s
      retries: 12
  pgadmin:
    image: dpage/pgadmin4:9.18
    environment:
      PGADMIN_DISABLE_POSTFIX: "true"
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: adminpass
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: adminpass
      KC_HOSTNAME: http://localhost:8080
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./docker/keycloak:/opt/keycloak/data/import:ro
  shard0:
    image: postgres:17
    environment:
      POSTGRES_DB: bookcatalog
      POSTGRES_USER: bookuser
      POSTGRES_PASSWORD: bookpass
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - shard0_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookuser -d bookcatalog"]
      interval: 5s
      timeout: 5s
      retries: 12
  shard1:
    image: postgres:17
    environment:
      POSTGRES_DB: bookcatalog
      POSTGRES_USER: bookuser
      POSTGRES_PASSWORD: bookpass
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - shard1_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookuser -d bookcatalog"]
      interval: 5s
      timeout: 5s
      retries: 12
  shard2:
    image: postgres:17
    environment:
      POSTGRES_DB: bookcatalog
      POSTGRES_USER: bookuser
      POSTGRES_PASSWORD: bookpass
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - shard2_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookuser -d bookcatalog"]
      interval: 5s
      timeout: 5s
      retries: 12
  warehouse:
    image: postgres:17
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: bookuser
      POSTGRES_PASSWORD: bookpass
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookuser -d warehouse"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  redis_data:
  keycloak_data:
  postgres_data:
  pgadmin_data:
  shard0_data:
  shard1_data:
  shard2_data:
  warehouse_data:
