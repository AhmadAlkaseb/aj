spring.application.name=${SPRING_APPLICATION_NAME:library-rest-api}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlite:library.db}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.sqlite.JDBC}
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
server.port=${SERVER_PORT:8081}
