syntax = "proto3"; // Bruger version 3 af Protocol Buffers-sproget.

package org.example.book; // Angiver navnerummet og her også pakken til den genererede Java-kode.
option java_multiple_files = true; // Genererer en separat Java-fil for hver beskedtype.
option java_outer_classname = "BookServiceProto"; // Navngiver Java-klassen med protofilens beskrivelse.

// To unary-kald og ét abonnement på nye bøger.
service BookService {
  rpc GetBookById(GetBookByIdRequest) returns (Book);
  rpc CreateBook(CreateBookRequest) returns (CreateBookResponse);
  rpc WatchBooks(WatchBooksRequest) returns (stream Book);
}

// Oplysningerne, der sendes om en bog.
message Book {
  int64 id = 1;
  string name = 2;
  int64 author_id = 3;
  int64 publisher_id = 4;
  int32 publication_year = 5;
}

// Tilmelding kræver ingen parametre.
message WatchBooksRequest {}

// Bog-ID til opslag.
message GetBookByIdRequest {
  int64 book_id = 1;
}

// Oplysninger til oprettelse; serveren tildeler selv ID.
message CreateBookRequest {
  string name = 1;
  int64 author_id = 2;
  int64 publisher_id = 3;
  int32 publication_year = 4;
}

// Den oprettede bog inklusive dens nye ID.
message CreateBookResponse {
  Book book = 1;
}
