spring.application.name=${SPRING_APPLICATION_NAME:library-graph-api}
server.port=${SERVER_PORT:8085}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlite:library.db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.sqlite.JDBC}

spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

spring.graphql.path=/graphql
spring.graphql.graphiql.enabled=true
