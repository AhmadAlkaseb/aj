name: product-synchronizer CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'product-synchronizer/**'
      - 'service-common/**'
      - 'pom.xml'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/service-ci.yaml'
      - '.github/workflows/product-synchronizer.yaml'
  pull_request:
    paths:
      - 'product-synchronizer/**'
      - 'service-common/**'
      - 'pom.xml'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/service-ci.yaml'
      - '.github/workflows/product-synchronizer.yaml'

permissions:
  contents: read

concurrency:
  group: product-synchronizer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/service-ci.yaml
    with:
      service: product-synchronizer
