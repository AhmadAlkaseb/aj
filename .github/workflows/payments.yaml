name: payments CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'payments/**'
      - 'service-common/**'
      - 'pom.xml'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/service-ci.yaml'
      - '.github/workflows/payments.yaml'
  pull_request:
    paths:
      - 'payments/**'
      - 'service-common/**'
      - 'pom.xml'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/service-ci.yaml'
      - '.github/workflows/payments.yaml'

permissions:
  contents: read

concurrency:
  group: payments-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/service-ci.yaml
    with:
      service: payments
