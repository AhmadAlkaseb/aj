name: product-view CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'product-view/**'
      - 'service-common/**'
      - 'pom.xml'
      - '.github/workflows/service-ci.yaml'
      - '.github/workflows/product-view.yaml'
  pull_request:
    paths:
      - 'product-view/**'
      - 'service-common/**'
      - 'pom.xml'
      - '.github/workflows/service-ci.yaml'
      - '.github/workflows/product-view.yaml'

permissions:
  contents: read

concurrency:
  group: product-view-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/service-ci.yaml
    with:
      service: product-view
