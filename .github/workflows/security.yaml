name: Reusable · security and dependency audits
'on':
  workflow_call:
    inputs:
      plan:
        type: string
        default: '{}'
  schedule:
    - cron: 23 5 * * 1
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  repository-scan:
    name: Scan ${{ matrix.scanner }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scanner:
          ${{ fromJSON((inputs.plan == '' || inputs.plan == '{}') && '["vuln","secret","misconfig"]'
          || toJSON(fromJSON(inputs.plan).security_scanners)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Scan repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: ${{ matrix.scanner }}
          format: json
          output: security-${{ matrix.scanner }}.json
          severity: HIGH,CRITICAL
          exit-code: '1'
          skip-dirs: .git,test-results,backups,node_modules,tools/contracts/node_modules
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: repository-security-${{ matrix.scanner }}
          path: security-${{ matrix.scanner }}.json
          retention-days: 14
  python-sast:
    name: Bandit Python security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install bandit==1.8.6
      - name: Reject high-severity Python findings
        run: bandit -r scripts k8s -lll -ii -f json -o bandit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: bandit-security
          path: bandit.json
          retention-days: 14
    if: inputs.plan == '' || inputs.plan == '{}' || fromJSON(inputs.plan).flags['python-sast']
  python-dependencies:
    name: Audit Python dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        requirements:
          - validation
          - report
          - ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.9.0
      - name: Audit resolved dependency tree
        run: pip-audit -r scripts/requirements-${{ matrix.requirements }}.txt -f json -o pip-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: python-dependency-security-${{ matrix.requirements }}
          path: pip-audit.json
          retention-days: 14
    if: inputs.plan == '' || inputs.plan == '{}' || fromJSON(inputs.plan).flags['python-dependencies']
  npm-dependencies:
    name: Audit npm ${{ matrix.directory }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        directory:
          - .
          - tools/contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        working-directory: ${{ matrix.directory }}
      - name: Reject high and critical dependency vulnerabilities
        working-directory: ${{ matrix.directory }}
        run: npm audit --audit-level=high --json > "$GITHUB_WORKSPACE/npm-audit.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: npm-security-${{ strategy.job-index }}
          path: npm-audit.json
          retention-days: 14
    if: inputs.plan == '' || inputs.plan == '{}' || fromJSON(inputs.plan).flags['npm-dependencies']
  gate:
    name: Security gate
    if: always()
    needs:
      - repository-scan
      - python-sast
      - python-dependencies
      - npm-dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require selected security checks and explain planned skips
        env:
          RESULTS: ${{ toJSON(needs) }}
          PLAN: ${{ inputs.plan }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          flags = json.loads(os.environ['PLAN'] or '{}').get('flags', {})
          expected = {'repository-scan': True, **{name: flags.get(name, True) for name in ['python-sast','python-dependencies','npm-dependencies']}}
          subprocess.run([sys.executable,'scripts/ci_gate.py','--expected',json.dumps(expected),'--title','Security gate'],check=True)
          PY
