name: CodeQL security
'on':
  workflow_call: {}
  workflow_dispatch: {}
permissions:
  contents: read
  security-events: write
jobs:
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: java-kotlin
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - run: bash scripts/mvn_ci.sh -B -ntp package -DskipTests
      - name: Build standalone Java samples
        run: |
          for pom in \
            system-integration/assignment-1/graph/pom.xml \
            system-integration/assignment-1/grpc/pom.xml \
            system-integration/assignment-1/rest/pom.xml \
            system-integration/assignment-1/soap/pom.xml
          do
            bash scripts/mvn_ci.sh -B -ntp -f "$pom" test-compile -DskipTests
          done
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
    if: github.event.repository.private == false
