name: Static analysis and contracts
on:
  workflow_call:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/contracts/package-lock.json
      - run: mvn -B -ntp -Pquality verify
      - run: python -m pip install -r scripts/requirements-validation.txt
      - run: python scripts/generate_contracts.py --check
      - run: python scripts/check_contracts.py
      - run: npm ci --prefix tools/contracts --ignore-scripts
      - run: npm run validate --prefix tools/contracts
      - uses: docker://rhysd/actionlint:1.7.7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-analysis-and-contracts
          path: |
            **/target/spotbugsXml.xml
            **/target/surefire-reports/
            **/target/failsafe-reports/
