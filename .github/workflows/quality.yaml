name: Static analysis and contracts
on:
  workflow_call:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-analysis:
    name: SpotBugs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17', cache: maven}
      - run: mvn -B -ntp -Pquality verify -DskipTests
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spotbugs-reports
          path: '**/target/spotbugsXml.xml'
          retention-days: 14
  contracts:
    name: OpenAPI and AsyncAPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v7
        with: {node-version: '22', cache: npm, cache-dependency-path: tools/contracts/package-lock.json}
      - run: python -m pip install -r scripts/requirements-validation.txt
      - run: python scripts/generate_contracts.py --check
      - run: python scripts/check_contracts.py
      - run: npm ci --prefix tools/contracts --ignore-scripts
      - run: npm run validate --prefix tools/contracts
  deployment-validation:
    name: Workflows and deployment logic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - uses: docker://rhysd/actionlint:1.7.7
      - run: docker compose config --quiet
      - name: Deployment boundary tests
        run: |
          mkdir -p test-results
          python -m unittest discover -s scripts/tests -v > test-results/pipeline-tests.log 2>&1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: deployment-validation-reports
          path: test-results/pipeline-tests.log
          retention-days: 14
  gate:
    name: Quality gate
    if: always()
    needs: [static-analysis, contracts, deployment-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env: {RESULTS: '${{ toJSON(needs) }}'}
        run: |
          python -c 'import json,os; results=json.loads(os.environ["RESULTS"]); assert all(j["result"]=="success" for j in results.values()), results'
