name: System acceptance
on:
  workflow_call:
  workflow_dispatch:
  push:
    paths: ['**/src/**', '**/pom.xml', 'pom.xml', 'identity/**', 'scripts/**', 'Dockerfile', '.dockerignore', '*compose*.yml', '.github/workflows/**', 'k8s/**']
  pull_request:
    paths: ['**/src/**', '**/pom.xml', 'pom.xml', 'identity/**', 'scripts/**', 'Dockerfile', '.dockerignore', '*compose*.yml', '.github/workflows/**', 'k8s/**']
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: system-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    name: API, broker and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Start isolated runner stack
        run: docker compose --profile jobs build && docker compose up -d --wait --wait-timeout 300
      - run: python scripts/configure_identity.py
      - name: API purchase and dependency failures
        run: |
          mkdir -p test-results
          python scripts/smoke.py --failures 2>&1 | tee test-results/system.log
      - name: Retries, deadlines, compensation and PDF deduplication
        run: python scripts/check_reliability.py
      - name: Broker envelopes, dead letters and recovery
        run: python scripts/check_async.py --failures
      - name: Projection ownership and recovery
        run: python scripts/check_projection.py --failures
      - name: Seed integrity after recovery
        run: python scripts/check_demo.py
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p test-results
          docker compose ps -a > test-results/containers.txt
          docker compose logs --no-color > test-results/containers.log 2>&1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-system-reports
          path: test-results/
          retention-days: 14
      - name: Remove ephemeral runner stack
        if: always()
        run: docker compose down --volumes --remove-orphans
  browser:
    name: Browser, roles and identity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: docker compose up -d --build --wait --wait-timeout 300
      - run: python scripts/configure_identity.py
      - name: Install browser runtime
        run: |
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Direct backend ownership and registration
        run: python scripts/check_security.py
      - name: Desktop and mobile purchase journey
        run: python scripts/browser_check.py
      - name: OIDC login, logout and provider outage
        run: python scripts/check_oidc.py --failures
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p test-results
          docker compose ps -a > test-results/containers.txt
          docker compose logs --no-color > test-results/containers.log 2>&1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-system-reports
          path: test-results/
          retention-days: 14
      - name: Remove ephemeral runner stack
        if: always()
        run: docker compose down --volumes --remove-orphans
  cooperation:
    name: Fresh database backend cooperation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Self-starting backends, owner stores and real broker
        run: python scripts/cooperation.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cooperation-system-reports
          path: test-results/cooperation/
          retention-days: 14
  gate:
    name: System gate
    if: always()
    needs: [api, browser, cooperation]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env: {RESULTS: '${{ toJSON(needs) }}'}
        run: |
          python -c 'import json,os; results=json.loads(os.environ["RESULTS"]); assert all(j["result"]=="success" for j in results.values()), results'
