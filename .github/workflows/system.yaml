name: System tests

on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - 'users/**'
      - 'products/**'
      - 'orders/**'
      - 'payments/**'
      - 'product-view/**'
      - 'product-synchronizer/**'
      - 'apigateway/**'
      - 'frontend/**'
      - 'service-common/**'
      - 'identity/**'
      - 'scripts/**'
      - 'pom.xml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'users/**'
      - 'products/**'
      - 'orders/**'
      - 'payments/**'
      - 'product-view/**'
      - 'product-synchronizer/**'
      - 'apigateway/**'
      - 'frontend/**'
      - 'service-common/**'
      - 'identity/**'
      - 'scripts/**'
      - 'pom.xml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: system-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  system:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start complete application
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Configure local identities without replacing persisted data
        run: python scripts/configure_identity.py
      - name: System tests including outages and recovery
        run: |
          mkdir -p test-results
          set -o pipefail
          python scripts/smoke.py --failures 2>&1 | tee test-results/system.log
      - name: Verify automatic demonstration data
        run: python scripts/check_demo.py
      - name: Verify asynchronous backend cooperation and broker contracts
        run: python scripts/check_async.py --failures
      - name: Verify projection ownership and queued recovery
        run: python scripts/check_projection.py --failures
      - name: Install OIDC browser test dependencies
        run: |
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Verify customer ownership and self-registration
        run: python scripts/check_security.py
      - name: Verify browser commerce and mobile layout
        run: python scripts/browser_check.py
      - name: Verify isolated backend fixture
        run: python scripts/cooperation.py
      - name: Verify local OIDC login, logout and provider recovery
        run: python scripts/check_oidc.py --failures
      - name: Collect container diagnostics
        if: always()
        run: |
          mkdir -p test-results
          docker compose ps -a > test-results/containers.txt
          docker compose logs --no-color > test-results/containers.log 2>&1
      - name: Save system report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-test-reports
          path: test-results/
      - name: Stop test environment
        if: always()
        run: docker compose down --volumes --remove-orphans
