name: orders CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'orders/**'
      - 'service-common/**'
      - 'pom.xml'
      - '.github/workflows/service-ci.yaml'
      - '.github/workflows/orders.yaml'
  pull_request:
    paths:
      - 'orders/**'
      - 'service-common/**'
      - 'pom.xml'
      - '.github/workflows/service-ci.yaml'
      - '.github/workflows/orders.yaml'

permissions:
  contents: read

concurrency:
  group: orders-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/service-ci.yaml
    with:
      service: orders
