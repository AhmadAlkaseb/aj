name: Reusable · validate → test → package
'on':
  workflow_call:
    inputs:
      service:
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    name: 01 · Validate module
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Validate service input and Maven configuration
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          case "$SERVICE" in users|products|orders|payments|product-view|product-synchronizer|apigateway|frontend|confirmation-job) ;; *) exit 1 ;; esac
          mvn -B -ntp -pl "$SERVICE" -am validate
  unit:
    name: 02a · Unit tests
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Surefire
        env:
          SERVICE: ${{ inputs.service }}
        run: mvn -B -ntp -pl "$SERVICE" -am test
      - name: Test results in the GitHub summary
        if: always()
        run: python scripts/ci_report.py '**/target/surefire-reports/TEST-*.xml' --title 'Unit tests'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ${{ inputs.service }}-unit-reports
          path: '**/target/surefire-reports/'
          retention-days: 14
  integration:
    name: 02b · Integration tests
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Failsafe
        env:
          SERVICE: ${{ inputs.service }}
        run: mvn -B -ntp -pl "$SERVICE" -am verify -DskipUnitTests=true
      - name: Test results in the GitHub summary
        if: always()
        run: python scripts/ci_report.py '**/target/failsafe-reports/TEST-*.xml' --title 'Integration tests'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ${{ inputs.service }}-integration-reports
          path: '**/target/failsafe-reports/'
          retention-days: 14
  package:
    name: 03 · Verified JAR
    needs:
      - unit
      - integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Package and checksum
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          mvn -B -ntp -pl "$SERVICE" -am package -DskipTests
          test -s "$SERVICE/target/app.jar"
          cd "$SERVICE/target"
          sha256sum app.jar > app.jar.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.service }}-application
          path: |
            ${{ inputs.service }}/target/app.jar
            ${{ inputs.service }}/target/app.jar.sha256
          if-no-files-found: error
          retention-days: 14
  gate:
    name: 04 · Service gate
    if: always()
    needs:
      - validate
      - unit
      - integration
      - package
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require validation, both test tracks and packaging
        env:
          RESULTS: ${{ toJSON(needs) }}
          EXPECTED: '{"validate":true,"unit":true,"integration":true,"package":true}'
        run: python scripts/ci_gate.py --title "Service gate"
