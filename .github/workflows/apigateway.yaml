name: apigateway CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'apigateway/**'
      - 'service-common/**'
      - 'pom.xml'
      - '.github/workflows/service-ci.yaml'
      - '.github/workflows/apigateway.yaml'
  pull_request:
    paths:
      - 'apigateway/**'
      - 'service-common/**'
      - 'pom.xml'
      - '.github/workflows/service-ci.yaml'
      - '.github/workflows/apigateway.yaml'

permissions:
  contents: read

concurrency:
  group: apigateway-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/service-ci.yaml
    with:
      service: apigateway
