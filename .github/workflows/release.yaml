name: AJ CD · Verified release and deployment
'on':
  workflow_dispatch:
    inputs:
      publish:
        description: Build and publish scanned release images
        type: boolean
        default: false
      target:
        description: Deployment target (production promotes the same staging digests)
        type: choice
        options:
          - none
          - staging
          - production
        default: none
permissions:
  contents: read
  actions: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    name: Validate release request
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require trusted branch and published images for deployment
        env:
          PUBLISH: ${{ inputs.publish }}
          TARGET: ${{ inputs.target }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          if [ "$TARGET" != none ] && [ "$PUBLISH" != true ]; then
            echo 'Deployment requires publish=true.' >&2
            exit 1
          fi
  services:
    name: Verify ${{ matrix.service }}
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        service:
          - users
          - products
          - orders
          - payments
          - product-view
          - product-synchronizer
          - apigateway
          - frontend
          - confirmation-job
    uses: ./.github/workflows/service-ci.yaml
    with:
      service: ${{ matrix.service }}
  quality:
    needs: preflight
    uses: ./.github/workflows/quality.yaml
  system:
    needs: preflight
    uses: ./.github/workflows/system.yaml
  security:
    needs: preflight
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yaml
    if: github.event.repository.private == false
  images:
    if: "!cancelled() && inputs.publish && needs.verify.result == 'success'"
    needs:
      - verify
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yaml
  supply-chain:
    needs: preflight
    uses: ./.github/workflows/security.yaml
  staging:
    if: "!cancelled() && inputs.target != 'none' && needs.images.result == 'success'"
    needs: images
    uses: ./.github/workflows/deploy.yaml
    with:
      environment: staging
      artifact-run-id: ${{ format('{0}', github.run_id) }}
    secrets: inherit
  production:
    if: "!cancelled() && inputs.target == 'production' && needs.staging.result == 'success'"
    needs: staging
    uses: ./.github/workflows/deploy.yaml
    with:
      environment: production
      artifact-run-id: ${{ format('{0}', github.run_id) }}
    secrets: inherit
  summary:
    name: Release result
    if: always()
    needs:
      - preflight
      - services
      - quality
      - system
      - security
      - supply-chain
      - verify
      - images
      - staging
      - production
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Write stage results and propagate failures
        env:
          RESULTS: ${{ toJSON(needs) }}
          PUBLISH: ${{ inputs.publish }}
          TARGET: ${{ inputs.target }}
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          results = json.loads(os.environ['RESULTS'])
          expected = {name: True for name in ['preflight','services','quality','system','supply-chain','verify']}
          expected.update(security=os.environ['PRIVATE_REPOSITORY']=='false', images=os.environ['PUBLISH']=='true',
                          staging=os.environ['TARGET']!='none', production=os.environ['TARGET']=='production')
          import subprocess, sys
          subprocess.run([sys.executable,'scripts/ci_gate.py','--expected',json.dumps(expected),'--title','Release result'],check=True)
          PY
  verify:
    name: Release readiness · all required checks
    if: always()
    needs:
      - preflight
      - services
      - quality
      - system
      - security
      - supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require every release track; CodeQL is free on public repositories
        env:
          RESULTS: ${{ toJSON(needs) }}
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          expected = {name: True for name in ["preflight", "services", "quality", "system", "supply-chain"]}
          expected["security"] = os.environ["PRIVATE_REPOSITORY"] == "false"
          subprocess.run([sys.executable, "scripts/ci_gate.py", "--expected", json.dumps(expected), "--title", "Release readiness"], check=True)
          PY
