name: Reusable release images
'on':
  workflow_call: null
permissions:
  contents: read
  packages: write
jobs:
  image:
    name: Build and scan ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        service:
          - users
          - products
          - orders
          - payments
          - product-view
          - product-synchronizer
          - apigateway
          - frontend
          - confirmation-job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ matrix.service }}-application
          path: test-results/ci-images/${{ matrix.service }}-application
      - name: Verify exact tested JAR
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          cd "test-results/ci-images/$SERVICE-application"
          sha256sum -c app.jar.sha256
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve repository
        id: repository
        env:
          SERVICE: ${{ matrix.service }}
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aj-$SERVICE" >> "$GITHUB_OUTPUT"
      - name: Publish candidate with SBOM and provenance
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: test-results/ci-images
          file: Dockerfile.ci
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: ${{ steps.repository.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=aj-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=aj-${{ matrix.service }}
          sbom: true
          provenance: mode=max
      - name: Scan exact candidate digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.repository.outputs.image }}@${{ steps.build.outputs.digest }}
          format: json
          output: image-scan.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Record scanned digest
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE: ${{ steps.repository.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          python -c 'import json,os; from pathlib import Path; Path("image.json").write_text(json.dumps({"revision":os.environ["GITHUB_SHA"],"service":os.environ["SERVICE"],"image":os.environ["IMAGE"]}))'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: release-image-${{ matrix.service }}
          path: |
            image.json
            image-scan.json
          retention-days: 30
  manifest:
    name: Assemble verified release
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-image-*
          path: test-results/images
      - name: Validate all nine scanned images belong to this revision
        run: python scripts/ci_manifest.py test-results/images test-results/release.json --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-manifest
          path: test-results/release.json
          if-no-files-found: error
          retention-days: 90
