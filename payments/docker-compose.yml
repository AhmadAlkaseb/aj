services:
  db:
    image: postgres:16-alpine
    container_name: payments-db
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - payments_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payments"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payments-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 7000
      DB_URL: jdbc:postgresql://db:5432/payments
      DB_USER: postgres
      DB_PASSWORD: postgres
      HIBERNATE_DDL_AUTO: update
      HIBERNATE_SHOW_SQL: "false"
    ports:
      - "7001:7000"

volumes:
  payments_pg_data: