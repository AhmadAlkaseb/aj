{
  "name": "aj-payments",
  "services": {
    "payments-db": {
      "image": "postgres:16-alpine",
      "restart": "unless-stopped",
      "environment": {
        "POSTGRES_DB": "payments",
        "POSTGRES_USER": "postgres",
        "POSTGRES_PASSWORD": "postgres"
      },
      "ports": [
        "127.0.0.1:5436:5432"
      ],
      "volumes": [
        "payments-postgres-data:/var/lib/postgresql/data"
      ],
      "networks": [
        "payments-data"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U postgres -d payments"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 20
      }
    },
    "payments": {
      "build": {
        "context": "..",
        "dockerfile": "Dockerfile",
        "args": {
          "SERVICE": "payments"
        }
      },
      "image": "aj-payments:local",
      "restart": "unless-stopped",
      "environment": {
        "PORT": "7000",
        "DB_URL": "jdbc:postgresql://payments-db:5432/payments",
        "DB_USER": "postgres",
        "DB_PASSWORD": "postgres",
        "RABBITMQ_URL": "amqp://aj:aj-local@rabbitmq:5672/%2f",
        "DEMO_DATA_ENABLED": "${DEMO_DATA_ENABLED:-true}",
        "OIDC_ISSUER": "http://localhost:8180/realms/aj",
        "OIDC_JWKS_URL": "http://keycloak:8180/realms/aj/protocol/openid-connect/certs",
        "DB_BASELINE_EXISTING": "true"
      },
      "ports": [
        "127.0.0.1:7005:7000"
      ],
      "networks": [
        "backend",
        "payments-data"
      ],
      "depends_on": {
        "payments-db": {
          "condition": "service_healthy"
        }
      }
    }
  },
  "volumes": {
    "payments-postgres-data": {}
  },
  "networks": {
    "payments-data": {},
    "backend": {
      "external": true,
      "name": "aj-backend"
    }
  }
}
