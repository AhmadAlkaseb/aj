{
  "name": "aj-product-view",
  "services": {
    "product-view": {
      "build": {
        "context": "..",
        "dockerfile": "Dockerfile",
        "args": {
          "SERVICE": "product-view"
        }
      },
      "image": "aj-product-view:local",
      "restart": "unless-stopped",
      "environment": {
        "PORT": "7000",
        "MONGO_URI": "mongodb://product-view-mongo:27017",
        "MONGO_DB": "product_view",
        "PROJECTION_API_TOKEN": "${PROJECTION_API_TOKEN:-aj-projection-local}"
      },
      "ports": [
        "127.0.0.1:7006:7000"
      ],
      "networks": [
        "backend",
        "product-view-data"
      ],
      "depends_on": {
        "product-view-mongo": {
          "condition": "service_healthy"
        }
      }
    },
    "product-view-mongo": {
      "image": "mongo:7",
      "restart": "unless-stopped",
      "volumes": [
        "product-view-mongo-data:/data/db"
      ],
      "networks": [
        "product-view-data"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "quit(db.adminCommand('ping').ok ? 0 : 1)"
        ],
        "interval": "5s",
        "timeout": "5s",
        "retries": 20
      }
    }
  },
  "volumes": {
    "product-view-mongo-data": {}
  },
  "networks": {
    "backend": {
      "external": true,
      "name": "aj-backend"
    },
    "product-view-data": {}
  }
}
