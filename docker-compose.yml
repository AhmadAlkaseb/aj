{
  "name": "aj",
  "services": {
    "rabbitmq": {
      "image": "rabbitmq:4.1-management-alpine",
      "restart": "unless-stopped",
      "environment": {
        "RABBITMQ_DEFAULT_USER": "aj",
        "RABBITMQ_DEFAULT_PASS": "aj-local",
        "RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS": "-rabbitmq_prometheus return_per_object_metrics true",
        "RABBITMQ_NODENAME": "${AJ_RABBIT_NODENAME:-rabbit@rabbitmq}",
        "AJ_ADMIN_USER": "${AJ_ADMIN_USER:-admin}",
        "AJ_ADMIN_PASSWORD": "${AJ_ADMIN_PASSWORD:-Admin123!}"
      },
      "ports": [
        "127.0.0.1:5672:5672",
        "127.0.0.1:15672:15672"
      ],
      "volumes": [
        "rabbitmq-data:/var/lib/rabbitmq"
      ],
      "networks": [
        "backend"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "ping"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 10
      },
      "command": [
        "/bin/sh",
        "-c",
        "rabbitmq-plugins enable --offline rabbitmq_prometheus && exec rabbitmq-server"
      ],
      "hostname": "rabbitmq",
      "extra_hosts": [
        "${AJ_RABBIT_HOST_ALIAS:-rabbitmq}:127.0.0.1"
      ],
      "container_name": "rabbitmq"
    },
    "users-db": {
      "image": "postgres:16-alpine",
      "restart": "unless-stopped",
      "environment": {
        "POSTGRES_DB": "users",
        "POSTGRES_USER": "postgres",
        "POSTGRES_PASSWORD": "postgres"
      },
      "ports": [
        "127.0.0.1:5433:5432"
      ],
      "volumes": [
        "users-postgres-data:/var/lib/postgresql/data"
      ],
      "networks": [
        "users-data"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U postgres -d users"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 20
      },
      "container_name": "users-db"
    },
    "users": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile",
        "args": {
          "SERVICE": "users"
        }
      },
      "image": "aj-users:local",
      "restart": "unless-stopped",
      "environment": {
        "PORT": "7000",
        "DB_URL": "jdbc:postgresql://users-db:5432/users",
        "DB_USER": "postgres",
        "DB_PASSWORD": "postgres",
        "RABBITMQ_URL": "amqp://aj:aj-local@rabbitmq:5672/%2f",
        "DEMO_DATA_ENABLED": "${DEMO_DATA_ENABLED:-true}",
        "OIDC_ISSUER": "http://localhost:8180/realms/aj",
        "OIDC_JWKS_URL": "http://keycloak:8180/realms/aj/protocol/openid-connect/certs",
        "DB_BASELINE_EXISTING": "true"
      },
      "ports": [
        "127.0.0.1:7002:7000"
      ],
      "networks": [
        "backend",
        "users-data"
      ],
      "depends_on": {
        "users-db": {
          "condition": "service_healthy"
        },
        "rabbitmq": {
          "condition": "service_healthy"
        }
      },
      "container_name": "users"
    },
    "products-db": {
      "image": "postgres:16-alpine",
      "restart": "unless-stopped",
      "environment": {
        "POSTGRES_DB": "products",
        "POSTGRES_USER": "postgres",
        "POSTGRES_PASSWORD": "postgres"
      },
      "ports": [
        "127.0.0.1:5434:5432"
      ],
      "volumes": [
        "products-postgres-data:/var/lib/postgresql/data"
      ],
      "networks": [
        "products-data"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U postgres -d products"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 20
      },
      "container_name": "products-db"
    },
    "products": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile",
        "args": {
          "SERVICE": "products"
        }
      },
      "image": "aj-products:local",
      "restart": "unless-stopped",
      "environment": {
        "PORT": "7000",
        "DB_URL": "jdbc:postgresql://products-db:5432/products",
        "DB_USER": "postgres",
        "DB_PASSWORD": "postgres",
        "RABBITMQ_URL": "amqp://aj:aj-local@rabbitmq:5672/%2f",
        "DEMO_DATA_ENABLED": "${DEMO_DATA_ENABLED:-true}",
        "OIDC_ISSUER": "http://localhost:8180/realms/aj",
        "OIDC_JWKS_URL": "http://keycloak:8180/realms/aj/protocol/openid-connect/certs",
        "DB_BASELINE_EXISTING": "true",
        "OLLAMA_URL": "${OLLAMA_URL:-http://host.docker.internal:11434}",
        "OLLAMA_MODEL": "${OLLAMA_MODEL:-llama3.2:3b}"
      },
      "ports": [
        "127.0.0.1:7003:7000"
      ],
      "networks": [
        "backend",
        "products-data"
      ],
      "depends_on": {
        "products-db": {
          "condition": "service_healthy"
        },
        "rabbitmq": {
          "condition": "service_healthy"
        }
      },
      "container_name": "products"
    },
    "orders-db": {
      "image": "postgres:16-alpine",
      "restart": "unless-stopped",
      "environment": {
        "POSTGRES_DB": "orders",
        "POSTGRES_USER": "postgres",
        "POSTGRES_PASSWORD": "postgres"
      },
      "ports": [
        "127.0.0.1:5435:5432"
      ],
      "volumes": [
        "orders-postgres-data:/var/lib/postgresql/data"
      ],
      "networks": [
        "orders-data"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U postgres -d orders"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 20
      },
      "container_name": "orders-db"
    },
    "orders": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile",
        "args": {
          "SERVICE": "orders"
        }
      },
      "image": "aj-orders:local",
      "restart": "unless-stopped",
      "environment": {
        "PORT": "7000",
        "DB_URL": "jdbc:postgresql://orders-db:5432/orders",
        "DB_USER": "postgres",
        "DB_PASSWORD": "postgres",
        "RABBITMQ_URL": "amqp://aj:aj-local@rabbitmq:5672/%2f",
        "DEMO_DATA_ENABLED": "${DEMO_DATA_ENABLED:-true}",
        "OIDC_ISSUER": "http://localhost:8180/realms/aj",
        "OIDC_JWKS_URL": "http://keycloak:8180/realms/aj/protocol/openid-connect/certs",
        "DB_BASELINE_EXISTING": "true",
        "CONFIRMATION_TOKEN": "${CONFIRMATION_TOKEN:-aj-confirmation-local}"
      },
      "ports": [
        "127.0.0.1:7004:7000"
      ],
      "networks": [
        "backend",
        "orders-data"
      ],
      "depends_on": {
        "orders-db": {
          "condition": "service_healthy"
        },
        "rabbitmq": {
          "condition": "service_healthy"
        }
      },
      "container_name": "orders"
    },
    "payments-db": {
      "image": "postgres:16-alpine",
      "restart": "unless-stopped",
      "environment": {
        "POSTGRES_DB": "payments",
        "POSTGRES_USER": "postgres",
        "POSTGRES_PASSWORD": "postgres"
      },
      "ports": [
        "127.0.0.1:5436:5432"
      ],
      "volumes": [
        "payments-postgres-data:/var/lib/postgresql/data"
      ],
      "networks": [
        "payments-data"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U postgres -d payments"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 20
      },
      "container_name": "payments-db"
    },
    "payments": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile",
        "args": {
          "SERVICE": "payments"
        }
      },
      "image": "aj-payments:local",
      "restart": "unless-stopped",
      "environment": {
        "PORT": "7000",
        "DB_URL": "jdbc:postgresql://payments-db:5432/payments",
        "DB_USER": "postgres",
        "DB_PASSWORD": "postgres",
        "RABBITMQ_URL": "amqp://aj:aj-local@rabbitmq:5672/%2f",
        "DEMO_DATA_ENABLED": "${DEMO_DATA_ENABLED:-true}",
        "OIDC_ISSUER": "http://localhost:8180/realms/aj",
        "OIDC_JWKS_URL": "http://keycloak:8180/realms/aj/protocol/openid-connect/certs",
        "DB_BASELINE_EXISTING": "true"
      },
      "ports": [
        "127.0.0.1:7005:7000"
      ],
      "networks": [
        "backend",
        "payments-data"
      ],
      "depends_on": {
        "payments-db": {
          "condition": "service_healthy"
        },
        "rabbitmq": {
          "condition": "service_healthy"
        }
      },
      "container_name": "payments"
    },
    "product-view-mongo": {
      "image": "mongo:7",
      "restart": "unless-stopped",
      "volumes": [
        "product-view-mongo-data:/data/db"
      ],
      "networks": [
        "product-view-data"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "quit(db.adminCommand('ping').ok ? 0 : 1)"
        ],
        "interval": "5s",
        "timeout": "5s",
        "retries": 20
      },
      "container_name": "product-view-db"
    },
    "product-view": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile",
        "args": {
          "SERVICE": "product-view"
        }
      },
      "image": "aj-product-view:local",
      "restart": "unless-stopped",
      "environment": {
        "PORT": "7000",
        "MONGO_URI": "mongodb://product-view-mongo:27017",
        "MONGO_DB": "product_view",
        "PROJECTION_API_TOKEN": "${PROJECTION_API_TOKEN:-aj-projection-local}"
      },
      "ports": [
        "127.0.0.1:7006:7000"
      ],
      "networks": [
        "backend",
        "product-view-data"
      ],
      "depends_on": {
        "product-view-mongo": {
          "condition": "service_healthy"
        }
      },
      "container_name": "product-view"
    },
    "product-synchronizer": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile",
        "args": {
          "SERVICE": "product-synchronizer"
        }
      },
      "image": "aj-product-synchronizer:local",
      "restart": "unless-stopped",
      "environment": {
        "PORT": "7000",
        "RABBITMQ_URL": "amqp://aj:aj-local@rabbitmq:5672/%2f",
        "PRODUCT_VIEW_URL": "http://product-view:7000",
        "PROJECTION_API_TOKEN": "${PROJECTION_API_TOKEN:-aj-projection-local}"
      },
      "ports": [
        "127.0.0.1:7007:7000"
      ],
      "networks": [
        "backend"
      ],
      "container_name": "product-synchronizer"
    },
    "apigateway": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile",
        "args": {
          "SERVICE": "apigateway"
        }
      },
      "image": "aj-apigateway:local",
      "restart": "unless-stopped",
      "environment": {
        "PORT": "7000",
        "OIDC_ISSUER": "http://localhost:8180/realms/aj",
        "OIDC_JWKS_URL": "http://keycloak:8180/realms/aj/protocol/openid-connect/certs",
        "KEYCLOAK_URL": "http://keycloak:8180"
      },
      "ports": [
        "127.0.0.1:8080:7000"
      ],
      "networks": [
        "backend",
        "edge"
      ],
      "container_name": "apigateway"
    },
    "frontend": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile",
        "args": {
          "SERVICE": "frontend"
        }
      },
      "image": "aj-frontend:local",
      "restart": "unless-stopped",
      "environment": {
        "PORT": "7000",
        "GATEWAY_URL": "http://apigateway:7000"
      },
      "ports": [
        "127.0.0.1:3000:7000"
      ],
      "networks": [
        "edge"
      ],
      "container_name": "frontend"
    },
    "keycloak-db": {
      "image": "postgres:16-alpine",
      "restart": "unless-stopped",
      "environment": {
        "POSTGRES_DB": "keycloak",
        "POSTGRES_USER": "keycloak",
        "POSTGRES_PASSWORD": "keycloak-local"
      },
      "volumes": [
        "keycloak-postgres-data:/var/lib/postgresql/data"
      ],
      "networks": [
        "identity-data"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U keycloak -d keycloak"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 20
      },
      "container_name": "keycloak-db"
    },
    "keycloak": {
      "image": "quay.io/keycloak/keycloak:26.8.1",
      "command": [
        "start-dev",
        "--import-realm"
      ],
      "restart": "unless-stopped",
      "environment": {
        "KC_DB": "postgres",
        "KC_DB_URL": "jdbc:postgresql://keycloak-db:5432/keycloak",
        "KC_DB_USERNAME": "keycloak",
        "KC_DB_PASSWORD": "keycloak-local",
        "KC_BOOTSTRAP_ADMIN_USERNAME": "${AJ_ADMIN_USER:-admin}",
        "KC_BOOTSTRAP_ADMIN_PASSWORD": "${AJ_ADMIN_PASSWORD:-Admin123!}",
        "KC_HTTP_PORT": "8180",
        "KC_HOSTNAME": "http://localhost:8180",
        "KC_HEALTH_ENABLED": "true"
      },
      "ports": [
        "127.0.0.1:8180:8180"
      ],
      "volumes": [
        "./identity/aj-realm.json:/opt/keycloak/data/import/aj-realm.json:ro"
      ],
      "networks": [
        "backend",
        "identity-data"
      ],
      "depends_on": {
        "keycloak-db": {
          "condition": "service_healthy"
        }
      },
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"
        ],
        "interval": "10s",
        "timeout": "5s",
        "start_period": "90s",
        "retries": 15
      },
      "container_name": "keycloak"
    },
    "confirmation-job": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile",
        "args": {
          "SERVICE": "confirmation-job"
        }
      },
      "image": "aj-confirmation-job:local",
      "restart": "unless-stopped",
      "environment": {
        "RABBITMQ_URL": "amqp://aj:aj-local@rabbitmq:5672/%2f",
        "ORDERS_URL": "http://orders:7000",
        "CONFIRMATION_TOKEN": "${CONFIRMATION_TOKEN:-aj-confirmation-local}",
        "CONFIRMATION_WORKER": "true"
      },
      "networks": [
        "backend"
      ],
      "container_name": "confirmation-job",
      "healthcheck": {
        "disable": true
      },
      "depends_on": {
        "rabbitmq": {
          "condition": "service_healthy"
        },
        "orders": {
          "condition": "service_healthy"
        }
      }
    },
    "prometheus": {
      "restart": "unless-stopped",
      "image": "prom/prometheus:v3.2.1",
      "ports": [
        "127.0.0.1:9090:9090"
      ],
      "volumes": [
        "./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro",
        "./observability/alerts.yml:/etc/prometheus/alerts.yml:ro",
        "prometheus-data:/prometheus"
      ],
      "networks": [
        "backend",
        "edge"
      ],
      "container_name": "prometheus"
    },
    "loki": {
      "restart": "unless-stopped",
      "image": "grafana/loki:3.4.2",
      "command": [
        "-config.file=/etc/loki/local-config.yaml"
      ],
      "ports": [
        "127.0.0.1:3100:3100"
      ],
      "volumes": [
        "./observability/loki.yml:/etc/loki/local-config.yaml:ro",
        "loki-data:/loki"
      ],
      "networks": [
        "backend"
      ],
      "container_name": "loki"
    },
    "alloy": {
      "restart": "unless-stopped",
      "image": "grafana/alloy:v1.8.0",
      "command": [
        "run",
        "--storage.path=/var/lib/alloy/data",
        "/etc/alloy/config.alloy"
      ],
      "volumes": [
        "./observability/alloy.alloy:/etc/alloy/config.alloy:ro",
        "/var/run/docker.sock:/var/run/docker.sock:ro",
        "alloy-data:/var/lib/alloy/data"
      ],
      "networks": [
        "backend"
      ],
      "container_name": "alloy"
    },
    "grafana": {
      "restart": "unless-stopped",
      "image": "grafana/grafana:11.5.2",
      "ports": [
        "127.0.0.1:${GRAFANA_PORT:-13001}:3000"
      ],
      "environment": {
        "GF_SECURITY_ADMIN_USER": "${AJ_ADMIN_USER:-admin}",
        "GF_SECURITY_ADMIN_PASSWORD": "${AJ_ADMIN_PASSWORD:-Admin123!}",
        "GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH": "/var/lib/grafana/dashboards/details/aj-home.json"
      },
      "volumes": [
        "./observability/grafana:/etc/grafana/provisioning:ro",
        "./observability/dashboard.json:/var/lib/grafana/dashboards/aj.json:ro",
        "./observability/dashboards:/var/lib/grafana/dashboards/details:ro",
        "grafana-data:/var/lib/grafana"
      ],
      "networks": [
        "backend"
      ],
      "container_name": "grafana"
    },
    "database-gui": {
      "image": "adminer:5.4.1",
      "container_name": "database-gui",
      "restart": "unless-stopped",
      "ports": [
        "127.0.0.1:18080:8080"
      ],
      "environment": {
        "ADMINER_DEFAULT_SERVER": "users-db",
        "ADMINER_DESIGN": "nette"
      },
      "networks": [
        "users-data",
        "products-data",
        "orders-data",
        "payments-data",
        "identity-data"
      ]
    },
    "mongo-gui": {
      "image": "mongo-express:1.0.2-20",
      "container_name": "mongo-gui",
      "restart": "unless-stopped",
      "ports": [
        "127.0.0.1:18081:8081"
      ],
      "environment": {
        "ME_CONFIG_MONGODB_URL": "${MONGO_ADMIN_URL:-mongodb://admin:Admin123!@product-view-mongo:27017/?authSource=admin}",
        "ME_CONFIG_BASICAUTH": "true",
        "ME_CONFIG_BASICAUTH_ENABLED": "true",
        "ME_CONFIG_BASICAUTH_USERNAME": "${AJ_ADMIN_USER:-admin}",
        "ME_CONFIG_BASICAUTH_PASSWORD": "${AJ_ADMIN_PASSWORD:-Admin123!}"
      },
      "networks": [
        "product-view-data"
      ],
      "depends_on": {
        "product-view-mongo": {
          "condition": "service_healthy"
        }
      }
    },
    "kubernetes-gui": {
      "image": "ghcr.io/headlamp-k8s/headlamp:v0.46.0",
      "container_name": "kubernetes-gui",
      "restart": "unless-stopped",
      "ports": [
        "127.0.0.1:14466:4466"
      ],
      "command": [
        "-kubeconfig=/config/kubeconfig.json",
        "-html-static-dir=/headlamp/frontend"
      ],
      "volumes": [
        "./test-results/admin:/config:ro"
      ],
      "networks": [
        "backend"
      ]
    }
  },
  "volumes": {
    "rabbitmq-data": {},
    "users-postgres-data": {},
    "products-postgres-data": {},
    "orders-postgres-data": {},
    "payments-postgres-data": {},
    "product-view-mongo-data": {},
    "keycloak-postgres-data": {},
    "prometheus-data": {
      "external": true,
      "name": "aj_prometheus-data"
    },
    "loki-data": {
      "external": true,
      "name": "aj_loki-data"
    },
    "grafana-data": {
      "external": true,
      "name": "aj_grafana-data"
    },
    "alloy-data": {
      "external": true,
      "name": "aj_alloy-data"
    }
  },
  "networks": {
    "backend": {
      "name": "aj-backend"
    },
    "edge": {
      "name": "aj-edge"
    },
    "users-data": {},
    "products-data": {},
    "orders-data": {},
    "payments-data": {},
    "identity-data": {},
    "product-view-data": {}
  }
}
